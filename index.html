<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascenso · Física y Matemáticas</title>
<meta name="description" content="App para estudiar Física y Matemáticas para el ascenso a Suboficial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira:wght@400;500;600;700&display=swap">
<style>
/* VOICE: un compañero de instrucción: directo, animado, sin rollo.
   IDEA: la cartilla de ascensos; cada pregunta acertada te acerca al siguiente empleo.
   PICTURE: el emblema del empleo actual, grande, con la barra de experiencia hacia el siguiente.
   COLOUR and TYPE: verde militar dominante, caqui de apoyo, latón como acento; Saira Stencil para rangos, Saira para el resto.
   LAYOUT: banda del rango arriba, misión del día como gran botón, temas en filas con barra de dominio; el test ocupa la pantalla. */
:root{color-scheme:light dark;
--bg:light-dark(#eceee3,#11150c);--card:light-dark(#ffffff,#1a2013);--ink:light-dark(#1b2312,#e7ebdb);--mute:light-dark(#5a6449,#9ba58a);--line:light-dark(#d6dbc8,#2e3724);
--ol:light-dark(#3f4f24,#25301a);--ol2:light-dark(#56693a,#3b4a28);--kh:light-dark(#d8cfa8,#6f6a4c);--br:#d9a521;--brd:light-dark(#9a7410,#e7bb45);
--ok:light-dark(#2b7a40,#62c47a);--bad:light-dark(#b33a2c,#ec7564);--okbg:light-dark(#e2f1e5,#163020);--badbg:light-dark(#f8e2de,#3a1b16)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Saira,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.st{font-family:"Saira Stencil One",Saira,sans-serif;font-weight:400;letter-spacing:.01em}
.wrap{max-width:1000px;margin:0 auto;padding:0 max(4vw,16px)}
.band{background:var(--ol);color:#f2f0e3;padding:clamp(22px,4vw,44px) 0 clamp(26px,4vw,48px)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,36px);align-items:center}
.ins{width:clamp(104px,16vw,150px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.hero h1{margin:0;font-size:clamp(34px,6vw,52px);line-height:1.05;text-wrap:balance}
.hero .sub{margin:2px 0 12px;color:#d8d5bd}
.xp{height:14px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#b98c14,var(--br));border-radius:8px;transition:width .6s}
.xpl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#d8d5bd;margin-top:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
.stat{background:rgba(0,0,0,.18);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.stat b{font-size:26px;line-height:1;display:block}.stat span{font-size:13px;color:#d8d5bd}
.ring{width:44px;height:44px;flex:none}
.mis{margin-top:-26px;position:relative}
.mbtn{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;text-align:left;border:0;border-radius:16px;padding:20px clamp(18px,3vw,28px);background:var(--br);color:#1f1a06;box-shadow:0 8px 22px rgba(60,45,0,.25)}
.mbtn h2{margin:0;font-size:clamp(24px,4vw,32px);line-height:1.1}
.mbtn p{margin:4px 0 0;font-size:15px}
.go{font-weight:700;background:#1f1a06;color:var(--br);border-radius:12px;padding:12px 18px;white-space:nowrap}
.mbtn.done{background:var(--kh)}
h3{font-size:22px;margin:34px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;min-height:44px;font-weight:600}
.tab[aria-pressed=true]{background:var(--ol);border-color:var(--ol);color:#f2f0e3}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px}
.tp:hover{border-color:var(--ol2)}
.tp strong{font-weight:600}.tp small{color:var(--mute);font-size:13px;white-space:nowrap}
.bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ol2)}
.weak{font-size:12px;font-weight:700;color:var(--brd);margin-left:6px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.tool{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:96px}
.tool strong{display:block;font-size:18px}.tool span{color:var(--mute);font-size:14px}
.rank{list-style:none;margin:0;padding:0}.rr{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto 44px;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}.rr:last-child{border-bottom:0}.rr .pos{font-weight:700;text-align:center}.rr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rr .rkn{font-size:13px;color:var(--mute);white-space:nowrap}.rr .pts{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}.rr .stk{font-size:13px;color:var(--brd);text-align:right;white-space:nowrap}.rr.me{background:light-dark(#f6efd6,#2b2612);border-radius:8px}.rank .gap{text-align:center;color:var(--mute)}
@media(max-width:600px){.rr{grid-template-columns:28px minmax(0,1fr) auto 40px}.rr .rkn{display:none}}
.foot{color:var(--mute);font-size:13px;margin:34px 0 40px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;padding:14px 0}
.x{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;min-height:44px;font-size:20px}
.prog{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ol2);transition:width .3s}
.cnt{font-weight:600;white-space:nowrap}
.chip{display:inline-block;font-size:13px;font-weight:600;background:var(--kh);color:#2a2a18;border-radius:999px;padding:3px 12px}
.combo{background:var(--br);color:#1f1a06}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);margin-bottom:14px}
.qtext{font-size:clamp(19px,2.6vw,23px);line-height:1.4;margin:12px 0 18px;font-weight:500}
.opts{display:grid;gap:10px}.opts.let{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}.opts.let .op{grid-template-columns:1fr;justify-items:center;font-size:22px;font-weight:700}.opts.let .op>span:last-child{display:none}.opts.let .op .k{width:auto;height:auto;border:0;background:none;font-size:22px}
.qtext img,.exp img{display:block;max-width:100%;height:auto;margin:8px 0;border-radius:8px;background:#fff}
.exp a{color:var(--ink);font-weight:600}.qtext img,.exp img{cursor:zoom-in}#zoom{position:fixed;inset:0;z-index:50;background:rgba(10,14,6,.92);overflow:auto;padding:56px 12px 24px;display:flex;align-items:flex-start;justify-content:center}#zoom img{max-width:none;width:min(1400px,240vw);background:#fff;border-radius:8px}#zoom button{position:fixed;top:10px;right:10px;min-width:44px;min-height:44px;border-radius:10px;border:0;font-size:22px;background:#f2f0e3;color:#1b2312}.src{font-size:13px;color:var(--mute);margin-top:8px}
.rev details>div{margin-top:10px}
.op{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:56px;font-size:18px}
.op .k{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px}
.op:hover:not([disabled]){border-color:var(--ol2)}
.op.ok{border-color:var(--ok);background:var(--okbg)}.op.bad{border-color:var(--bad);background:var(--badbg)}
.op.pick{border-color:var(--ol2);background:var(--card)}
.op[disabled]{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:0;border-radius:12px;padding:12px 22px;min-height:48px;font-weight:700;background:var(--ol);color:#f2f0e3}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.hint{margin-top:12px;padding:10px 14px;border-left:4px solid var(--br);background:light-dark(#fbf5e2,#2b2612);border-radius:6px}
.exp{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg)}
.exp b.v{font-size:18px}.exp.good b.v{color:var(--ok)}.exp.wrong b.v{color:var(--bad)}
.fly{position:fixed;font-weight:700;color:var(--brd);font-size:22px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fly{animation:none;opacity:0}.xp i,.prog i{transition:none}}
.mx{display:inline-flex;align-items:center;gap:6px;margin:8px 14px 0 0;vertical-align:middle}
.mx table{border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:6px;border-collapse:separate;padding:2px 4px}
.mx td{padding:2px 9px;text-align:right;font-variant-numeric:tabular-nums}
/* results */
.big{font-size:clamp(44px,9vw,72px);line-height:1;margin:6px 0}
.rup{background:var(--br);color:#1f1a06;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin:14px 0}
.rup svg{width:64px;flex:none}
.rev{margin-top:10px}.rev details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rev summary{cursor:pointer;font-weight:500}
/* fichas */
.card3d{perspective:1200px;margin:10px 0}
.flip{position:relative;width:100%;min-height:240px;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .5s}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;text-align:center;padding:24px;backface-visibility:hidden;font-size:clamp(20px,3vw,26px)}
.front{background:var(--ol);color:#f2f0e3}.back{background:var(--card);border:2px solid var(--ol2);transform:rotateY(180deg);font-weight:600}
.face small{display:block;font-size:14px;opacity:.75;margin-top:8px;font-weight:400}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
@media(max-width:600px){.hero{grid-template-columns:1fr;justify-items:start}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{flex-direction:column;align-items:flex-start;gap:4px;padding:8px 10px}.stat b{font-size:22px}.ring{display:none}.mbtn{grid-template-columns:1fr}.go{justify-self:start}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
//GEN-START
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fmt=n=>{n=Math.round(n*1e4)/1e4;if(Object.is(n,-0))n=0;return(n<0?'−':'')+Math.abs(n).toLocaleString('es-ES',{maximumFractionDigits:4,useGrouping:false})};
const P=n=>n<0?`(${fmt(n)})`:fmt(n);
const U=(n,u)=>fmt(n)+' '+u;
const sp=n=>String(n).replace(/-/g,'⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const sb=n=>String(n).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
const sci=(x,d=2)=>{if(!x)return'0';const s=x<0?'−':'';x=Math.abs(x);let e=Math.floor(Math.log10(x)+1e-9),m=x/10**e;m=Math.round(m*10**d)/10**d;if(m>=10){m/=10;e++}if(e>=0&&e<=3)return s+fmt(m*10**e);return s+(m===1?'':fmt(m)+'·')+'10'+sp(e)};
const S_=(x,u)=>sci(x)+' '+u;
const frac=(a,b)=>{if(b<0){a=-a;b=-b}const g=gcd(Math.abs(a),b)||1;a/=g;b/=g;return b===1?fmt(a):(a<0?'−':'')+Math.abs(a)+'/'+b};
const poly=t=>{let s='';t.forEach(([c,v])=>{if(!c)return;const n=c<0,a=Math.abs(c),k=(a===1&&v)?'':fmt(a);s+=s?(n?' − ':' + '):(n?'−':'');s+=k+v});return s||'0'};
const vec=v=>`(${v.map(fmt).join(', ')})`;
const hm=h=>{const m=Math.round(h*60),H=Math.floor(m/60),M=m%60;return((H?H+' h':'')+(H&&M?' ':'')+(M?M+' min':''))||'0 min'};
const M=(rows,l)=>`<span class="mx">${l?l+' =':''}<table>${rows.map(r=>'<tr>'+r.map(x=>`<td>${fmt(x)}</td>`).join('')+'</tr>').join('')}</table></span>`;
const FILL=['Ninguna de las anteriores','Faltan datos para calcularlo','No tiene solución'];
const vary=a=>{const m=a.match(/−?\d+(,\d+)?/);if(!m)return[];const v=parseFloat(m[0].replace('−','-').replace(',','.'));return[v*2,v+1,v-1,v/2,v*10,-v,v+2].map(x=>a.slice(0,m.index)+fmt(x)+a.slice(m.index+m[0].length)).filter(x=>!/^0\//.test(x))};
const mk=(q,a,w,e,h)=>{a=String(a);const s=new Set([a]),o=[a];for(const x of [...w,...vary(a),...FILL]){const v=String(x);if(o.length>=4)break;if(!s.has(v)&&!/NaN|undefined|Infinity/.test(v)){s.add(v);o.push(v)}}return{q,a,o:shuffle(o),e,h}};
const G10=' (g = 10 m/s²)';
const T3=[[1,2,2,3],[2,3,6,7],[1,4,8,9],[2,6,9,11],[4,4,7,9],[2,2,1,3]];
const sgn=v=>v.map(x=>x*pick([1,-1]));

const TOP={m:[['ari','Números: fracciones, potencias y logaritmos'],['ecu','Ecuaciones, porcentajes e interés'],['tri','Trigonometría y geometría plana'],['mtx','Matrices'],['det','Determinantes'],['sis','Sistemas de ecuaciones'],['vec','Vectores en R³'],['geo','Geometría analítica del espacio'],['fun','Funciones y dominio'],['lim','Límites, continuidad y asíntotas'],['der','Derivadas'],['est','Estudio de una función'],['int','Integrales'],['sta','Estadística'],['pro','Probabilidad']],
f:[['cie','Trabajo científico y unidades'],['mec','Cinemática'],['dyn','Dinámica, energía y movimiento circular'],['gra','Campo gravitatorio'],['elc','Campo eléctrico'],['mag','Campo magnético'],['ind','Inducción electromagnética'],['mas','Movimiento armónico simple'],['ond','Movimiento ondulatorio'],['feo','Fenómenos ondulatorios'],['luz','La luz'],['opt','Óptica geométrica'],['rel','Relatividad'],['cua','Física cuántica'],['nuc','Radiactividad']]};

const G={
ari:[
()=>{const b=pick(['2','3','5','x','a']),m=R(2,7),n=R(2,6),p=R(1,5),e=m+n-p;return mk(`Simplifica: ${b}${sp(m)} · ${b}${sp(n)} ÷ ${b}${sp(p)}`,b+sp(e),[b+sp(m*n-p),b+sp(m+n+p),b+sp(m-n+p),b+sp(e+1)],`Misma base: al multiplicar se suman los exponentes y al dividir se restan → ${m} + ${n} − ${p} = ${e}.`,'aᵐ · aⁿ = aᵐ⁺ⁿ   y   aᵐ ÷ aⁿ = aᵐ⁻ⁿ')},
()=>{const k=R(2,6),b=pick([2,3,5,6,7]),N=k*k*b;return mk(`Simplifica la raíz: √${N}`,`${k}√${b}`,[`${b}√${k}`,`${k*k}√${b}`,`${k}√${b*2}`,`${k+1}√${b}`],`${N} = ${k*k} · ${b} = ${k}² · ${b}, así que √${N} = ${k}√${b}.`,'Busca el mayor cuadrado perfecto que divida al número.')},
()=>{const a=pick([2,3,4,5,10]),n=R(1,3),v=a**n;return mk(`Calcula ${a}${sp(-n)}`,`1/${v}`,[`−${v}`,`−1/${v}`,`1/${a*n}`,`${v}`],`Un exponente negativo invierte la base: ${a}${sp(-n)} = 1/${a}${sp(n)} = 1/${v}.`,'a⁻ⁿ = 1/aⁿ')},
()=>{const a=pick([2,3,5]),m=R(2,4),n=R(2,3);return mk(`Simplifica: (${a}${sp(m)})${sp(n)}`,a+sp(m*n),[a+sp(m+n),a+sp(m**n),(a*n)+sp(m),a+sp(m*n+1)],`Potencia de una potencia: se multiplican los exponentes → ${m}·${n} = ${m*n}.`,'(aᵐ)ⁿ = aᵐ·ⁿ')},
()=>{const b=pick([2,3,5,10]),k=b===2?R(1,6):R(1,4),N=b**k,L=b===10?'log':'log'+sb(b);return mk(`Calcula ${L} ${fmt(N)}`,String(k),[String(k+1),String(k-1||k+2),fmt(N/b),String(b*k)],`${b}${sp(k)} = ${fmt(N)}, así que ${L} ${fmt(N)} = ${k}.`,'log_b N es el exponente al que hay que elevar b para obtener N.')},
()=>{const m=R(1,5),n=R(1,5),X=2**m,Y=2**n;return mk(`Calcula log₂ ${X} + log₂ ${Y}`,String(m+n),[String(m*n),String(m+n+1),fmt(X+Y),String(Math.abs(m-n))],`log₂ ${X} + log₂ ${Y} = log₂ (${X}·${Y}) = log₂ ${X*Y} = ${m+n}  (o directamente ${m} + ${n}).`,'log a + log b = log (a·b)')},
()=>{const b=pick([2,3,10]),k=R(2,4),N=b**k,L=b===10?'log':'log'+sb(b);return mk(`Resuelve: ${L} x = ${k}`,`x = ${fmt(N)}`,[`x = ${fmt(b*k)}`,`x = ${fmt(k**b)}`,`x = ${fmt(N/b)}`,`x = ${fmt(N*b)}`],`Por definición, x = ${b}${sp(k)} = ${fmt(N)}.`,'log_b x = k  ⇔  x = bᵏ')},
()=>{const b=R(2,6),d=R(2,6),a=R(1,5),c=R(1,5);return mk(`Calcula: ${a}/${b} + ${c}/${d}`,frac(a*d+c*b,b*d),[frac(a+c,b+d),frac(a*c,b*d),frac(a+c,b*d),frac(a*d+c*b+1,b*d)],`Común denominador ${b*d}: ${a*d}/${b*d} + ${c*b}/${b*d} = ${a*d+c*b}/${b*d} = ${frac(a*d+c*b,b*d)}.`,'a/b + c/d = (a·d + c·b) / (b·d), y simplifica.')},
()=>{const a=R(2,9),b=R(2,6),c=R(2,6),d=R(1,9);return mk(`Calcula: ${a} + ${b} · ${c} − ${d}`,fmt(a+b*c-d),[fmt((a+b)*c-d),fmt(a+b*(c-d)),fmt(a+b+c-d),fmt(a+b*c+d)],`Primero la multiplicación: ${b}·${c} = ${b*c}. Luego de izquierda a derecha: ${a} + ${b*c} − ${d} = ${a+b*c-d}.`,'Orden: paréntesis, potencias, multiplicaciones y divisiones, sumas y restas.')}],
ecu:[

  quiz()}
const clock=()=>{const s=Math.floor((Date.now()-Z.t0)/1000);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function quiz(){
  const q=Z.qs[Z.i],sim=Z.mode==='sim';Z.hint=false;Z.locked=false;
  app.innerHTML=`<main class="wrap" style="max-width:780px">
  <div class="qtop"><button class="x" id="bX" aria-label="Salir">×</button><div class="prog"><i style="width:${Z.i/Z.qs.length*100}%"></i></div><span class="cnt">${Z.i+1}/${Z.qs.length}</span>${sim?`<span class="chip" id="tm">${clock()}</span>`:''}</div>
  <div class="qcard"><span class="chip">${tname(q.t)}</span> ${!sim&&Z.combo>=3?`<span class="chip combo">Racha ×${Z.combo}</span>`:''}
    <div class="qtext">${rs(q.q)}</div>
    <div class="opts ${q.o.every(o=>o.length<=2)?'let':''}">${q.o.map((o,k)=>`<button class="op" data-k="${k}"><span class="k">${'ABCDEFGHIJ'[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div id="after"></div>
    <div class="row" id="ctl">${sim?'<button class="btn alt" id="bB">Dejar en blanco</button>':(q.h?'<button class="btn alt" id="bH">Pista (−5 XP)</button>':'')}</div>
  </div></main>`;
  document.getElementById('bX').onclick=()=>{clearInterval(timer);home()};
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));
  const bh=document.getElementById('bH');if(bh)bh.onclick=()=>{Z.hint=true;bh.remove();document.getElementById('after').innerHTML=`<div class="hint"><b>Pista:</b> ${q.h}</div>`};
  const bb=document.getElementById('bB');if(bb)bb.onclick=()=>{Z.blank++;Z.ans.push({q,pick:null});next()};
}
function fly(el,txt){const r=el.getBoundingClientRect(),s=document.createElement('span');s.className='fly';s.textContent=txt;s.style.left=(r.right-70)+'px';s.style.top=(r.top)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}
function answer(k,el){
  if(Z.locked)return;Z.locked=true;
  const q=Z.qs[Z.i],good=q.o[k]===q.a,sim=Z.mode==='sim';touch();
  S.today.n++;if(good)S.today.ok++;
  if(S.today.n===10&&S.lastDay!==today()){S.streak=S.lastDay===yest()?S.streak+1:1;S.lastDay=today()}
  if(q.aid){S.seen=S.seen||[];if(!S.seen.includes(q.aid))S.seen.push(q.aid)}const tp=S.tp[q.t]||(S.tp[q.t]={ok:0,n:0});tp.n++;if(good)tp.ok++;
  Z.ans.push({q,pick:q.o[k]});
  if(good){Z.ok++;Z.combo++}else{Z.bad++;Z.combo=0}
  if(!good&&!S.fallos.some(f=>f.q===q.q)){S.fallos.unshift({q:q.q,a:q.a,o:q.o,e:q.e,h:q.h,t:q.t,fix:q.fix,aid:q.aid});S.fallos=S.fallos.slice(0,60)}
  if(good&&q.fromF)S.fallos=S.fallos.filter(f=>f.q!==q.q);
  if(sim){if(good){Z.xp+=6;S.xp+=6}save();app.querySelectorAll('.op').forEach(b=>b.disabled=true);el.classList.add('pick');setTimeout(next,250);return}
  let gain=0;if(good){gain=Z.hint?5:10;if(Z.combo>=3)gain+=5}else if(Z.hint)gain=-5;
  Z.xp+=gain;S.xp=Math.max(0,S.xp+gain);save();
  app.querySelectorAll('.op').forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  if(gain>0)fly(el,'+'+gain+' XP');
  document.getElementById('after').innerHTML=(Z.hint&&q.h?`<div class="hint"><b>Pista:</b> ${q.h}</div>`:'')+`<div class="exp ${good?'good':'wrong'}"><b class="v">${good?pick(['¡Correcto!','¡Bien hecho!','¡Eso es!','¡Al blanco!']):'No es esa. La buena es: '+q.a}</b><div style="margin:6px 0 0">${rs(q.e)}</div></div>`;
  document.getElementById('ctl').innerHTML=`<button class="btn" id="bN">${Z.i+1<Z.qs.length?'Siguiente':'Ver resultado'}</button>`;
  const bn=document.getElementById('bN');bn.onclick=next;bn.focus();
}
function next(){Z.i++;if(Z.i<Z.qs.length)quiz();else results()}
function results(){
  clearInterval(timer);view='res';
  const sim=Z.mode==='sim',n=Z.qs.length;
  if(Z.mode==='mis'&&S.mis!==today()){S.mis=today();Z.xp+=30;S.xp+=30}
  save();
  const r1=rankOf(S.xp),up=r1>Z.r0,nota=Z.ok/n*10,pen=Math.max(0,(Z.ok-Z.bad*.25)/n*10);
  const wrong=Z.ans.filter(a=>a.pick!==a.q.a);
  const msg=Z.ok/n>=.8?'Muy buen trabajo. Así se asciende.':Z.ok/n>=.5?'Vas bien. Repasa los fallos y sube el listón.':'Cada fallo de hoy es un acierto en el examen. Repásalos.';
  app.innerHTML=`<main class="wrap" style="max-width:780px;padding-top:24px">
  <div class="qcard">
    <span class="chip">${Z.title}</span>
    ${sim?`<p class="big st">${fmt(Math.round(pen*100)/100)}</p><p style="margin:0">Nota sobre 10 restando 0,25 por fallo · ${Z.ok} aciertos, ${Z.bad} fallos, ${Z.blank} en blanco · tiempo ${clock()}</p><p style="color:var(--mute);margin:4px 0 0">Sin penalización sería: ${fmt(Math.round(nota*100)/100)}${(Date.now()-Z.t0)>7200000?' · Te has pasado de los 120 minutos del examen':''}</p>`
    :`<p class="big st">+${Z.xp} XP</p><p style="margin:0">${Z.ok} de ${n} correctas. ${msg}</p>`}
    ${sim?`<p style="margin:10px 0 0"><b>+${Z.xp} XP</b> por los aciertos.</p>`:''}
    ${up?`<div class="rup">${ins(r1)}<div><b class="st" style="font-size:24px">¡Ascenso! Ahora eres ${RANKS[r1][0]}</b><br>Sigue así hasta Suboficial Mayor.</div></div>`:''}
    <div class="row"><button class="btn" id="bH2">Volver a la base</button>${wrong.length?'<button class="btn alt" id="bR">Repetir los fallos ahora</button>':''}</div>
  </div>
  ${wrong.length?`<h3>Revisa ${wrong.length===1?'tu fallo':'tus '+wrong.length+' fallos'}</h3><div class="rev">${wrong.map(a=>`<details><summary>${(a.q.q.replace(/<br>/g,' ').replace(/<span class="mx">[\s\S]*?<\/span>/g,'[matriz]').replace(/<img[^>]*>/g,'').replace(/<[^>]+>/g,'').trim())||'Pregunta de '+tname(a.q.t)}</summary><div>${/<img|class="mx"/.test(a.q.q)?rs(a.q.q):''}</div><p><b>Correcta:</b> ${a.q.a}${a.pick?` · <b>Marcaste:</b> ${a.pick}`:' · En blanco'}</p><div>${rs(a.q.e)}</div></details>`).join('')}</div>`:''}
  </main>`;
  document.getElementById('bH2').onclick=()=>{RANKT=0;home()};
  const br=document.getElementById('bR');if(br)br.onclick=()=>start(wrong.map(a=>({...a.q,o:a.q.fix?a.q.o:shuffle(a.q.o),fromF:true})),'fal','Repetir fallos');
  window.scrollTo(0,0);
}
function fichas(s,i){
  view='fic';const L=FC[s],c=L[(i+L.length)%L.length];i=(i+L.length)%L.length;
  app.innerHTML=`<main class="wrap" style="max-width:780px">
  <div class="qtop"><button class="x" id="bX" aria-label="Volver">×</button><div class="prog"><i style="width:${(i+1)/L.length*100}%"></i></div><span class="cnt">${i+1}/${L.length}</span></div>
  <div class="tabs"><button class="tab" data-s="m" aria-pressed="${s==='m'}">Matemáticas</button><button class="tab" data-s="f" aria-pressed="${s==='f'}">Física</button></div>
  <div class="card3d"><button class="flip" id="fl" aria-label="Dar la vuelta a la ficha"><span class="face front st">${c[0]}<small style="font-family:Saira">Piensa la fórmula y toca para comprobar</small></span><span class="face back">${c[1]}</span></button></div>
  <div class="row"><button class="btn alt" id="bP">Anterior</button><button class="btn" id="bNx">Siguiente</button><button class="btn alt" id="bRa">Al azar</button></div>
  </main>`;
  document.getElementById('bX').onclick=home;
  const fl=document.getElementById('fl');fl.onclick=()=>fl.classList.toggle('on');
  document.getElementById('bP').onclick=()=>fichas(s,i-1);
  document.getElementById('bNx').onclick=()=>fichas(s,i+1);
  document.getElementById('bRa').onclick=()=>fichas(s,R(0,L.length-1));
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>fichas(b.dataset.s,0));
}
document.addEventListener('click',e=>{const im=e.target.closest('.qtext img,.exp img');if(im){const z=document.createElement('div');z.id='zoom';z.innerHTML=`<button aria-label="Cerrar">×</button><img src="${im.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z)}});
document.addEventListener('keydown',e=>{
  if(view==='quiz'){if(/^[1-4]$/.test(e.key)){const b=app.querySelector(`.op[data-k="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}else if(/^[a-dA-D]$/.test(e.key)){const b=app.querySelector(`.op[data-k="${'abcd'.indexOf(e.key.toLowerCase())}"]`);if(b&&!b.disabled)b.click()}}
  if(view==='fic'){if(e.key==='ArrowRight')document.getElementById('bNx').click();if(e.key==='ArrowLeft')document.getElementById('bP').click()}
});
(async()=>{if(CRED){try{const r=await rpc('ascenso_login',{p_name:CRED.n,p_pin:CRED.p});if(r.error){CRED=null;try{localStorage.removeItem('ascenso-cred')}catch(e){}login(ERR[r.error]);return}const st=r.state||{};if(st.ts&&st.ts>(S.ts||0))S=Object.assign(blank(),st);cloud=true}catch(e){}home()}else{let loc=null;try{loc=localStorage.getItem('ascenso-local')}catch(e){}loc?home():login()}})();
}
</script>
